[package]
name = "schliffe"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Cuts token waste in Claude Code sessions: shell command output, MCP tool results, and prose. Deterministic, auditable, no telemetry."
repository = "https://github.com/mkmuniz/schliffe-tk"
homepage = "https://github.com/mkmuniz/schliffe-tk"
readme = "README.md"
keywords = ["claude-code", "tokens", "mcp", "compression", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
getrandom = "0.3.4"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = "1.1.3"
url = "2.5.8"
