# Layer B — specs.md §5.3. Target: `terraform plan`, 1-42% range for RTK
# (audit section 10.1). Typical noise: per-resource state refresh (one line
# per already-existing, unchanged resource) and the "unchanged" summary
# repeated per resource — what matters is what CHANGES, not what refreshed.
match_command = "terraform"
match_args_prefix = ["plan"]

[[pipeline]]
action = "strip_ansi"

[[pipeline]]
action = "strip_lines_matching"
patterns = ["^[a-zA-Z0-9_.\\[\\]\"-]+: Refreshing state\\.\\.\\.", "^\\s*#.*\\(no changes\\)"]

[[pipeline]]
action = "max_lines"
limit = 80
tail = 20 # "Plan: N to add, N to change, N to destroy" is the last line

[[pipeline]]
action = "on_empty"
message = "terraform plan: no changes"
